# Fails when the committed MCP bundle (modules/acro-td-mcp/dist/index.js) or its
# THIRD_PARTY_LICENSES.txt doesn't match its source. The bundle is committed so users only need Node, which means a src/ change
# without a rebuild would ship a stale server.
#
# To fix a failure: run `npm install && npm run build` at the repo root (or in
# modules/acro-td-mcp) and commit modules/acro-td-mcp/dist/.
#
# Builds from the module's own lockfile, the same one the standalone acro-td-mcp repo uses.
#
# Read-only on purpose (no bot commit), so it never makes a subtree push non-fast-forward.
name: MCP bundle

on:
  push:
    paths:
      - 'modules/acro-td-mcp/src/**'
      - 'modules/acro-td-mcp/dist/**'
      - 'modules/acro-td-mcp/build.mjs'
      - 'modules/acro-td-mcp/package*.json'
      - 'package*.json'
      - '.github/workflows/mcp-bundle.yml'
  pull_request:
    paths:
      - 'modules/acro-td-mcp/src/**'
      - 'modules/acro-td-mcp/dist/**'
      - 'modules/acro-td-mcp/build.mjs'
      - 'modules/acro-td-mcp/package*.json'
      - 'package*.json'
      - '.github/workflows/mcp-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modules/acro-td-mcp/package-lock.json
      - run: npm ci
        working-directory: modules/acro-td-mcp
      - run: npm run build
        working-directory: modules/acro-td-mcp
      - name: Bundle matches source
        run: |
          if ! git diff --quiet -- modules/acro-td-mcp/dist; then
            echo "::error::modules/acro-td-mcp/dist/ is out of date. Run 'npm run build' at the repo root and commit it."
            git diff --stat -- modules/acro-td-mcp/dist
            exit 1
          fi
