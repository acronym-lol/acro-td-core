# yaml-language-server: $schema=https://docs.acronym.lol/schemas/meta.schema.json
#
# Repo metadata for acro-docs, which aggregates this docs/ folder into the internal
# documentation site and publishes a catalog.json from these fields.
#
# Plain YAML with no dependency on any generator. The comment above gives editors live
# schema validation and is inert in every tool that does not understand it.

schema_version: 1
repo: acronym-lol/acro-td-core

name: Acro TD Core
summary: 'TouchDesigner project template bundling seven modules as git subtrees, with version management, external tox handling, and component scaffolding.'

owner: '@matthewwachter'
maintainers: []

# tier 1: every TD project starts from this template, so a break here halts the team.
tier: 1
status: active

# `internal` = visible only inside acro-docs. Nothing reaches the public acronym.lol
# tools page until this is flipped to `public`. Note this is UNRELATED to the repo being
# private on GitHub.
visibility: internal

category: touchdesigner

# Second level of the acro-docs sidebar, within `category`. This repo is the project
# template that the seven modules are bundled into as git subtrees.
group: project-template

requires:
  - TouchDesigner

links:
  # The existing Docsify site on GitHub Pages. Remove this if that site is retired in
  # favour of acro-docs. Worth knowing: it is publicly readable despite the repo being
  # private, which is normal GitHub Pages behaviour but may not be intended.
  homepage: https://acronym-lol.github.io/acro-td-core/
